services:
  - type: web
    name: safeheight
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BASE_URL
        sync: false          # Set this to your Render URL, e.g. https://safeheight.onrender.com
      - key: SECRET_KEY
        generateValue: true
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: 587
      - key: SMTP_USER
        sync: false          # Your Gmail address
      - key: SMTP_PASS
        sync: false          # Your Gmail App Password
      - key: FROM_NAME
        value: SafeHeight Certification System
      - key: MAGIC_LINK_EXPIRE_MINUTES
        value: 10080
      - key: PYTHON_VERSION
        value: "3.12.0"
